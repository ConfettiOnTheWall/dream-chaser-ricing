# ═══════════════════════════════════════
# FONT
# ═══════════════════════════════════════
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

disable_ligatures never
font_features     none

# ═══════════════════════════════════════
# WINDOW / OPACITY
# ═══════════════════════════════════════
background_opacity 0.80
dynamic_background_opacity yes

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# blur (só funciona com compositor rodando, ex: sway com blur patch ou wlroots recente)
background_blur 20

# ═══════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════
cursor_shape        beam
cursor_beam_thickness 1.5
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# ═══════════════════════════════════════
# SCROLLBACK
# ═══════════════════════════════════════
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# ═══════════════════════════════════════
# TAB BAR
# ═══════════════════════════════════════
tab_bar_edge            top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         2
tab_title_template        "{title}"

# ═══════════════════════════════════════
# MOUSE
# ═══════════════════════════════════════
mouse_hide_wait 3.0
copy_on_select  yes
strip_trailing_spaces smart

# ═══════════════════════════════════════
# BELL
# ═══════════════════════════════════════
enable_audio_bell no
visual_bell_duration 0.0

# ═══════════════════════════════════════
# LAYOUT
# ═══════════════════════════════════════
enabled_layouts splits, stack
active_border_color   #C2595A
inactive_border_color #2B2118
window_border_width   1.5pt

# ═══════════════════════════════════════
# COLOR SCHEME (wallpaper "Dream Chaser")
# ═══════════════════════════════════════
foreground              #E8D9BE
background              #1C1512
selection_foreground    #1C1512
selection_background    #C2595A

cursor                  #C9A063
cursor_text_color       #1C1512

url_color               #D9836A

active_tab_foreground   #1C1512
active_tab_background   #C2595A
inactive_tab_foreground #A38F76
inactive_tab_background #2B2118
tab_bar_background      #1C1512

# black
color0  #2B2118
color8  #6B5847
# red
color1  #C2595A
color9  #D97071
# green
color2  #9C9169
color10 #B4A97E
# yellow
color3  #C9A063
color11 #D8AF83
# blue
color4  #7C8FA6
color12 #93A6BC
# magenta
color5  #A6697A
color13 #BC8091
# cyan
color6  #7C9A92
color14 #93B1A9
# white
color7  #E8D9BE
color15 #F2E8D5

# ═══════════════════════════════════════
# KEYBINDS EXTRAS ÚTEIS
# ═══════════════════════════════════════
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab
map ctrl+shift+f     show_scrollback